name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: sherpa-onnx zwischenspeichern
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Versionsname bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Signaturschlüssel bereitstellen (falls Secrets gesetzt)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release wird signiert."
          else
            echo "Keine Signatur-Secrets gesetzt – Release-APK bleibt unsigniert."
          fi

      - name: Tests, Lint und Build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: APKs umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/open2ndbrain-${VERSION_NAME}-debug.apk"
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "dist/open2ndbrain-${VERSION_NAME}-release-unsigned.apk" ;;
              *) cp "$f" "dist/open2ndbrain-${VERSION_NAME}.apk" ;;
            esac
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: open2ndbrain-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berichte
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
